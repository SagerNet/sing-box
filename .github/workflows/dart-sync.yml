# Merge the latest upstream stable release into this fork, re-check Dart
# patches + Smart, push, then explicitly dispatch the release workflow.
name: Sync upstream with Dart patches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: dart-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: stable

      - name: Resolve upstream stable release
        id: stable
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SagerNet/sing-box.git 2>/dev/null || \
            git remote set-url upstream https://github.com/SagerNet/sing-box.git
          git fetch --no-tags upstream stable
          tag="$(
            git ls-remote --tags --refs upstream 'v*' |
              awk '{ sub("^refs/tags/", "", $2); print $2 }' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1 ||
              true
          )"
          if [[ -z "$tag" ]]; then
            echo "::error::No stable semantic-version tag was found upstream."
            exit 1
          fi
          git fetch --no-tags upstream "refs/tags/${tag}:refs/tags/${tag}"
          commit="$(git rev-parse "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" upstream/stable; then
            echo "::error::Latest stable tag $tag is not reachable from upstream/stable."
            exit 1
          fi
          echo "UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"
          echo "UPSTREAM_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream stable release $tag at $commit"

      - name: Merge upstream stable release
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            echo "Already contains upstream stable $UPSTREAM_TAG."
          else
            git merge --no-ff "$UPSTREAM_TAG" -m "chore: sync upstream stable $UPSTREAM_TAG"
          fi

      - name: Ensure Dart HTTP latency patch
        run: |
          set -euo pipefail
          patch=.github/patches/allow-http-clash-api-delay.patch
          if [[ ! -f "$patch" ]]; then
            echo "Missing $patch" >&2
            exit 1
          fi
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Dart HTTP latency patch already applied."
          elif git apply --check "$patch"; then
            git apply "$patch"
            git add experimental/clashapi/proxies.go
            git commit -m "Apply Dart HTTP latency patch"
          else
            echo "Dart patch no longer applies cleanly." >&2
            exit 1
          fi
          if grep -Fq 'strings.HasPrefix(url, "http://")' experimental/clashapi/proxies.go; then
            echo "HTTP latency-test blocking logic is still present." >&2
            exit 1
          fi

      - name: Verify Dart Smart registration hooks
        run: |
          set -euo pipefail
          test -f protocol/group/smart/outbound.go
          test -d protocol/group/smart/engine
          test -f option/smart.go
          grep -Fq 'TypeSmart = "smart"' constant/proxy.go
          grep -Fq 'smart.RegisterOutbound(registry)' include/registry.go

      - name: Determine whether stable changed
        id: changes
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/stable)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: true

      - name: Smoke test + build
        if: steps.changes.outputs.changed == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go test ./protocol/group/smart/... -count=1
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          ldflags="$(tr -d '\r\n' < release/LDFLAGS)"
          GOOS=windows GOARCH=amd64 go build \
            -trimpath -tags "$tags" -ldflags "$ldflags -s -w -buildid=" \
            -o /tmp/sing-box.exe ./cmd/sing-box
          test -s /tmp/sing-box.exe

      - name: Push stable
        run: |
          set -euo pipefail
          if [[ "${{ steps.changes.outputs.changed }}" == "true" ]]; then
            git push --atomic origin \
              HEAD:stable \
              "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          else
            # Mirror provenance even if the release commit was merged manually.
            git push origin "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          fi

      - name: Check whether this commit needs a core release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${UPSTREAM_TAG#v}"
          dart_tag="$(
            git tag --points-at HEAD --list "v${base}-dart.*" |
              grep -E "^v${base//./\\.}-dart\.[1-9][0-9]*$" |
              sort -V |
              tail -n 1 ||
              true
          )"
          needed=true
          if [[ -n "$dart_tag" ]]; then
            version="${dart_tag#v}"
            archive="sing-box-${version}-windows-amd64.zip"
            release_state="$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${dart_tag}" \
                --jq "[.draft, .prerelease, ([.assets[] | select(.name == \"$archive\" and .size > 0)] | length), ([.assets[] | select(.name == \"SHA256SUMS.txt\" and .size > 0)] | length)] | @tsv" \
                2>/dev/null ||
                true
            )"
            if [[ "$release_state" == $'false\tfalse\t1\t1' ]]; then
              needed=false
              echo "Complete stable Dart release already exists at $dart_tag."
            else
              echo "Release $dart_tag is incomplete and will be repaired."
            fi
          else
            echo "No Dart release tag for stable $UPSTREAM_TAG points at HEAD."
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not recursively start push workflows.
      # Dispatch explicitly; the scheduled sync also retries incomplete releases.
      - name: Dispatch Dart Core Release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dart-release.yml --repo "$GITHUB_REPOSITORY" --ref stable
