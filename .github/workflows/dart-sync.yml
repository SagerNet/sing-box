# Merge upstream stable into this fork, re-check Dart patches + Smart, push.
# Release is handled by dart-release.yml on the subsequent push to stable.
name: Sync upstream with Dart patches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: dart-upstream-stable-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: stable

      - name: Configure repositories
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SagerNet/sing-box.git 2>/dev/null || \
            git remote set-url upstream https://github.com/SagerNet/sing-box.git
          git fetch --no-tags upstream stable

      - name: Merge upstream stable
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/stable HEAD; then
            echo "Already up to date with upstream/stable."
          else
            git merge --no-ff upstream/stable -m "chore: sync upstream stable"
          fi

      - name: Ensure Dart HTTP latency patch
        run: |
          set -euo pipefail
          patch=.github/patches/allow-http-clash-api-delay.patch
          if [[ ! -f "$patch" ]]; then
            echo "Missing $patch" >&2
            exit 1
          fi
          if git apply --reverse --check "$patch" 2>/dev/null; then
            echo "Dart HTTP latency patch already applied."
          elif git apply --check "$patch"; then
            git apply "$patch"
            git add experimental/clashapi/proxies.go
            git commit -m "Apply Dart HTTP latency patch"
          else
            echo "Dart patch no longer applies cleanly." >&2
            exit 1
          fi
          if grep -Fq 'strings.HasPrefix(url, "http://")' experimental/clashapi/proxies.go; then
            echo "HTTP latency-test blocking logic is still present." >&2
            exit 1
          fi

      - name: Verify Dart Smart registration hooks
        run: |
          set -euo pipefail
          test -f protocol/group/smart/outbound.go
          test -d protocol/group/smart/engine
          test -f option/smart.go
          grep -Fq 'TypeSmart = "smart"' constant/proxy.go
          grep -Fq 'smart.RegisterOutbound(registry)' include/registry.go

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: true

      - name: Smoke test + build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          go test ./protocol/group/smart/... -count=1
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          ldflags="$(tr -d '\r\n' < release/LDFLAGS)"
          go build -trimpath -tags "$tags" -ldflags "$ldflags -s -w -buildid=" \
            -o /tmp/sing-box.exe ./cmd/sing-box
          test -s /tmp/sing-box.exe

      - name: Push stable
        run: |
          set -euo pipefail
          git push origin HEAD:stable
          # Pushing stable triggers Dart Core Release (push event).
