# Upstream full multi-platform release pipeline — disabled on this Dart maintenance fork.
# Use "Dart Core Release" for Windows amd64 publish. Keep file so upstream merges are quieter.
name: Build (upstream, disabled)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Upstream multi-platform build is disabled on the Dart fork"
        required: false
        type: string

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This is blakebill/sing-box (Dart fork)."
          echo "Use workflow: Dart Core Release for Windows core publish."
          echo "Upstream Build matrix is intentionally not run on push."
