# Dart-maintained Windows core: build CURRENT stable branch (includes Smart + patches)
# and publish a GitHub Release. Do NOT checkout bare upstream tags (that drops Dart code).
name: Dart Core Release

on:
  push:
    branches:
      - stable
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "clients/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional full Dart version (e.g. 1.13.14-dart.3). Empty = auto."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dart-sing-box-release
  cancel-in-progress: true

jobs:
  release:
    name: Test, build, publish Windows amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stable (Dart tree)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: stable

      - name: Resolve stable-based version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          stable_tag="$(
            git tag --merged HEAD --list 'v*' |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              sort -V |
              tail -n 1 ||
              true
          )"
          if [[ -z "$stable_tag" ]]; then
            echo "::error::HEAD is not based on a stable semantic-version tag."
            exit 1
          fi
          base="${stable_tag#v}"
          requested="${REQUESTED#v}"
          should_build=true

          if [[ -n "$requested" ]]; then
            if [[ ! "$requested" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-dart\.([1-9][0-9]*)$ ]]; then
              echo "::error::Requested version must look like 1.13.14-dart.3."
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" != "$base" ]]; then
              echo "::error::Requested base ${BASH_REMATCH[1]} does not match reachable stable $base."
              exit 1
            fi
            version="$requested"
            dart_tag="v$version"
            if git rev-parse -q --verify "refs/tags/$dart_tag" >/dev/null; then
              tagged_commit="$(git rev-parse "$dart_tag^{commit}")"
              if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
                echo "::error::$dart_tag already points at $tagged_commit, not the checked-out commit."
                exit 1
              fi
            fi
          else
            dart_tag="$(
              git tag --points-at HEAD --list "v${base}-dart.*" |
                grep -E "^v${base//./\\.}-dart\.[1-9][0-9]*$" |
                sort -V |
                tail -n 1 ||
                true
            )"
            if [[ -n "$dart_tag" ]]; then
              version="${dart_tag#v}"
              archive="sing-box-${version}-windows-amd64.zip"
              release_state="$(
                gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${dart_tag}" \
                  --jq "[.draft, .prerelease, ([.assets[] | select(.name == \"$archive\" and .size > 0)] | length), ([.assets[] | select(.name == \"SHA256SUMS.txt\" and .size > 0)] | length)] | @tsv" \
                  2>/dev/null ||
                  true
              )"
              if [[ "$release_state" == $'false\tfalse\t1\t1' ]]; then
                should_build=false
                echo "Commit already has a complete release at $dart_tag; skipping duplicate build."
              else
                echo "Release $dart_tag is incomplete; rebuilding its assets."
              fi
            else
              version="${base}-dart.${RUN_NUMBER}"
              dart_tag="v${version}"
            fi
          fi

          archive="sing-box-${version}-windows-amd64.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dart_tag=$dart_tag" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "stable=$stable_tag version=$version build=$should_build sha=$(git rev-parse --short HEAD)"

      - name: Verify Dart Smart and feedback API are present
        if: steps.version.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          test -f protocol/group/smart/outbound.go
          test -f protocol/group/smart/feedback.go
          test -d protocol/group/smart/engine
          test -f experimental/clashapi/dial_feedback.go
          grep -Fq 'TypeSmart = "smart"' constant/proxy.go
          grep -Fq 'smart.RegisterOutbound(registry)' include/registry.go
          grep -Fq 'json:"signal"' protocol/group/smart/feedback.go
          grep -Fq 'func DialFeedbackSince(since uint64)' protocol/group/smart/feedback.go
          grep -Fq 'func DialFeedbackDetailedSince(since uint64)' protocol/group/smart/feedback.go
          grep -Fq 'Get("signals") == "1"' experimental/clashapi/dial_feedback.go
          grep -Fq 'r.Get("/dart/dial-feedback", getDialFeedback)' experimental/clashapi/server.go

      - name: Setup Go
        if: steps.version.outputs.should_build == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: true

      - name: Test Smart + Clash API
        if: steps.version.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          go test ./protocol/group/smart/... -count=1
          go test -tags with_clash_api ./experimental/clashapi/... -count=1

      - name: Build Windows amd64
        if: steps.version.outputs.should_build == 'true'
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          ldflags="$(tr -d '\r\n' < release/LDFLAGS)"
          package="sing-box-${VERSION}-windows-amd64"
          mkdir -p "dist/$package"
          go build -trimpath -tags "$tags" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $ldflags -s -w -buildid=" \
            -o "dist/$package/sing-box.exe" ./cmd/sing-box
          test -s "dist/$package/sing-box.exe"
          cp LICENSE "dist/$package/LICENSE"
          (cd dist && zip -9 -r "$package.zip" "$package")
          (cd dist && sha256sum "$package.zip" > SHA256SUMS.txt)
          test -s "dist/$package.zip"

      - name: Publish GitHub Release
        if: steps.version.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DART_TAG: ${{ steps.version.outputs.dart_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
          STABLE_TAG: ${{ steps.version.outputs.stable_tag }}
        run: |
          set -euo pipefail
          notes="Dart-maintained Windows amd64 build based on upstream stable $STABLE_TAG ($(git rev-parse --short HEAD)). Includes Dart Smart outbound, privacy-preserving dial feedback API, and HTTP Clash API latency-test patch."
          if gh release view "$DART_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DART_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$DART_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "sing-box $VERSION" --latest --notes "$notes" \
              --draft=false --prerelease=false \
              --target "$(git rev-parse HEAD)"
          else
            gh release create "$DART_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sing-box $VERSION" \
              --latest \
              --notes "$notes" \
              --target "$(git rev-parse HEAD)"
          fi
