# Dart-maintained Windows core: build CURRENT stable branch (includes Smart + patches)
# and publish a GitHub Release. Do NOT checkout bare upstream tags (that drops Dart code).
name: Dart Core Release

on:
  push:
    branches:
      - stable
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "clients/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional full Dart version (e.g. 1.13.14-dart.3). Empty = auto."
        required: false
        type: string
  schedule:
    - cron: "47 3 * * *"

permissions:
  contents: write

concurrency:
  group: dart-sing-box-release
  cancel-in-progress: true

jobs:
  release:
    name: Test, build, publish Windows amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout stable (Dart tree)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
          ref: stable

      - name: Verify Dart Smart is present
        run: |
          set -euo pipefail
          test -f protocol/group/smart/outbound.go
          test -d protocol/group/smart/engine
          grep -Fq 'TypeSmart = "smart"' constant/proxy.go
          grep -Fq 'smart.RegisterOutbound(registry)' include/registry.go

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"
          cache: true

      - name: Test Smart + Clash API
        run: |
          set -euo pipefail
          go test ./protocol/group/smart/... -count=1
          go test -tags with_clash_api ./experimental/clashapi/... -count=1

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED:-}" ]]; then
            version="${REQUESTED#v}"
          else
            # Prefer latest upstream stable tag as base, always append unique -dart.N
            base="$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name | sed 's/^v//')"
            if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # Fallback: last local tag without -dart suffix
              base="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null | sed -E 's/^v//;s/-dart\.[0-9]+$//')"
            fi
            if [[ -z "$base" ]]; then
              base="0.0.0"
            fi
            version="${base}-dart.${RUN_NUMBER}"
          fi
          dart_tag="v${version}"
          archive="sing-box-${version}-windows-amd64.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dart_tag=$dart_tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Publishing $dart_tag from $(git rev-parse --short HEAD)"

      - name: Build Windows amd64
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          ldflags="$(tr -d '\r\n' < release/LDFLAGS)"
          package="sing-box-${VERSION}-windows-amd64"
          mkdir -p "dist/$package"
          go build -trimpath -tags "$tags" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $ldflags -s -w -buildid=" \
            -o "dist/$package/sing-box.exe" ./cmd/sing-box
          test -s "dist/$package/sing-box.exe"
          cp LICENSE "dist/$package/LICENSE"
          (cd dist && zip -9 -r "$package.zip" "$package")
          (cd dist && sha256sum "$package.zip" > SHA256SUMS.txt)
          test -s "dist/$package.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DART_TAG: ${{ steps.version.outputs.dart_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          # Tag current HEAD so release source includes Smart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$DART_TAG" >/dev/null 2>&1; then
            git tag -d "$DART_TAG" || true
            git push origin ":refs/tags/$DART_TAG" || true
          fi
          git tag -f "$DART_TAG"
          git push origin "refs/tags/$DART_TAG" --force

          notes="Dart-maintained Windows amd64 build of blakebill/sing-box@stable ($(git rev-parse --short HEAD)). Includes Dart Smart outbound + HTTP Clash API latency-test patch."
          if gh release view "$DART_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$DART_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$DART_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "sing-box $VERSION" --latest --notes "$notes" \
              --target "$(git rev-parse HEAD)"
          else
            gh release create "$DART_TAG" \
              "dist/$ARCHIVE" \
              "dist/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "sing-box $VERSION" \
              --latest \
              --notes "$notes" \
              --target "$(git rev-parse HEAD)"
          fi
